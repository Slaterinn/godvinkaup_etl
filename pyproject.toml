[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",  # line too long; formatter handles most cases, long strings/URLs are allowed for now
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
